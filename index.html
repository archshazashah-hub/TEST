<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Shara & Irfan</title>

<style>

body {

  background: #f8f1ee;

  color: #594944;

  font-family: Georgia, serif;

  text-align: center;

  padding-top: 25vh;

}

button {

  padding: 15px 28px;

  border: 1px solid #b99b91;

  border-radius: 30px;

  background: #fffaf7;

  color: #594944;

  font-size: 16px;

  cursor: pointer;

}

</style>

</head>

<body>

<h1>💌</h1>

<h1>Shara & Irfan</h1>

<p>YOU ARE INVITED</p>

<button onclick="openInvitation()">

Tap to Open 💌

</button>

<p id="status"></p>

<audio id="music" loop>

  <source src="a-couple-minutes-instrumental.mp3" type="audio/mpeg">

</audio>

<script>
  const invitationURL =
    "https://sharaxirfanengagement.my.canva.site/engagement-invitation-2026";

  const button = document.getElementById("openButton");
  const music = document.getElementById("music");
  const status = document.getElementById("status");

  button.addEventListener("click", function () {

    // Start music immediately from the first user tap.
    music.currentTime = 0;
    const musicPromise = music.play();

    // Open Canva in a new tab.
    const invitationTab = window.open(invitationURL, "_blank");

    if (!invitationTab) {
      status.textContent =
        "Please allow pop-ups to open the invitation.";
    }

    if (musicPromise !== undefined) {
      musicPromise.then(() => {
        status.textContent = "Enjoy the music ♡";
      }).catch((error) => {
        status.textContent =
          "Music could not start. Please check the audio file.";
        console.error("Audio playback error:", error);
      });
    }
  });
</script>
