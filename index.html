<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f0e7">
  <title>Shara & Irfan | Engagement Invitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #f7f0e7;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .invitation {
      position: relative;
      width: 100%;
      max-width: 680px;
      line-height: 0;
    }

    .invitation img {
      display: block;
      width: 100%;
      height: auto;
    }

    .open-link {
      position: absolute;
      left: 26.4%;
      width: 47.2%;
      top: 87.5%;
      height: 7.5%;
      border-radius: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .open-link:focus-visible {
      outline: 3px solid #8b6848;
      outline-offset: 3px;
    }

    .hint {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>

  <main class="invitation">

    <img
      src="a_clean_elegant_wedding_invitation_style_webpage.png"
      alt="You are cordially invited. Shara and Irfan. Tap to Open."
    >

    <a
      class="open-link"
      href="https://sharaxirfanengagement.my.canva.site/engagement-invitation-2026"
      target="_blank"
      rel="noopener"
      aria-label="Tap to open Shara and Irfan's engagement invitation"
    >
      <span class="hint">Tap to Open</span>
    </a>

  </main>

  <audio
    id="music"
    src="a-couple-minutes-instrumental.mp3"
    preload="auto"
    loop
  ></audio>

  <script>
    const openLink = document.querySelector(".open-link");
    const music = document.getElementById("music");

    openLink.addEventListener("click", function () {
      music.play().catch(function () {
        // Safari may restrict background music playback.
      });
    });
  </script>

</body>
</html>
