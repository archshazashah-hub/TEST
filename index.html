<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f1ee">
  <title>Shara & Irfan — Engagement Invitation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f8f1ee; color: #594944;
    }
    #welcome {
      min-height: 100svh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 28px; gap: 18px;
      background: radial-gradient(circle at center, #fffaf7 0, #f8f1ee 72%);
    }
    .envelope { font-size: 42px; }
    h1 { font-weight: 400; font-size: clamp(30px, 7vw, 48px); margin: 0; }
    p { font-size: 15px; letter-spacing: .08em; margin: 0; }
    button {
      margin-top: 12px; border: 1px solid #b99b91; border-radius: 999px;
      background: #fffaf7; color: #594944; padding: 15px 27px;
      font: 16px Georgia, serif; cursor: pointer;
    }
    button:active { transform: scale(.98); }
    #invitation { display: none; width: 100%; height: 100svh; }
    #invitation iframe { display: block; width: 100%; height: 100%; border: 0; }
    #fallback {
      display: none; position: fixed; z-index: 5; bottom: 12px; left: 12px;
      right: 12px; text-align: center; font: 13px Arial, sans-serif;
      background: rgba(255,250,247,.94); padding: 10px; border-radius: 10px;
    }
    #fallback a { color: #76584f; }
  </style>
</head>
<body>
  <main id="welcome">
    <div class="envelope" aria-hidden="true">💌</div>
    <h1>Shara &amp; Irfan</h1>
    <p>YOU ARE INVITED</p>
    <button id="openButton" type="button">Tap to Open 💌</button>
  </main>

  <main id="invitation">
    <iframe
      src="https://sharaxirfanengagement.my.canva.site/engagement-invitation-2026"
      title="Shara and Irfan engagement invitation"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </main>

  <div id="fallback">
    If the invitation does not appear below,
    <a href="https://sharaxirfanengagement.my.canva.site/engagement-invitation-2026"
       target="_blank" rel="noopener">open the invitation here</a>.
  </div>

  <audio id="backgroundMusic" preload="auto" loop playsinline>
    <source src="a-couple-minutes-instrumental.mp3" type="audio/mpeg">
  </audio>

  <script>
    const openButton = document.getElementById("openButton");
    const welcome = document.getElementById("welcome");
    const invitation = document.getElementById("invitation");
    const music = document.getElementById("backgroundMusic");
    const fallback = document.getElementById("fallback");

    openButton.addEventListener("click", async () => {
      // Starting playback directly inside this tap is important on iPhone/Safari.
      try {
        await music.play();
      } catch (error) {
        alert("Please tap Open once more to start the background music.");
        return;
      }
      welcome.style.display = "none";
      invitation.style.display = "block";
      fallback.style.display = "block";
    });
  </script>
</body>
</html>
